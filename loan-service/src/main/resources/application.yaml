spring:
  application:
    name: loan-service

  kafka:
      bootstrap-servers: localhost:9092
      producer:
        key-serializer: org.apache.kafka.common.serialization.StringSerializer
        value-serializer: org.apache.kafka.common.serialization.StringSerializer

  cache:
          type: redis
          redis:
            time-to-live: 5m
            cache-null-values: false


  data:
    redis:
      host: localhost
      port: 6379
      connect-timeout: 2s
      timeout: 2s

  datasource:
    url: jdbc:postgresql://localhost:5432/loan_db
    username: loan_app_user
    password: postgres
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

server:
    port: 8081

management:
    endpoints:
      web:
        exposure:
          include: health,info

jwt:
  secret: ${JWT_SECRET}


